services:
  game-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command:
      [
        "dlv",
        "debug",
        "--headless",
        "--listen=:40000",
        "--api-version=2",
        "--accept-multiclient",
        "--log",
      ]
    ports:
      - "8080:8080"
      - "40000:40000"
    volumes:
      - .:/app
    env_file:
      - ./.env
    networks:
      - go_boilerplate_external_network
